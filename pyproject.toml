[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

# Component-development metadata only. Public Python publication is the
# aggregate "zog" distribution assembled by release-build.
[project]
name = "host-discover"
version = "0.4.8"
requires-python = ">=3.12"
license = "BSD-3-Clause OR GPL-3.0-only"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD-PARTY-NOTICES.md"]
dependencies = ["host-identify==0.3.4", "host-install==0.4.4"]

[project.scripts]
host-discover = "zog.host_discover.daemon:main"
host-discover-recovery = "zog.host_discover.recovery:main"
host-discover-supervisor = "zog.host_discover.supervisor:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["zog.host_discover*"]
namespaces = true

[tool.setuptools.package-data]
"zog.host_discover" = ["systemd/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
