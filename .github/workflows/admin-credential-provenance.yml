name: Administrator credential source and wheel notice evidence

on:
  push:
    branches: [review/admin-credential-source-provenance-20261102]
  pull_request:
    branches: [review/admin-password-profile-v1-20261101]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observed-provenance:
    name: Exact source and artifact notice observations
    runs-on: ubuntu-latest
    steps:
      - name: Check out evidence tools (not production candidate)
        uses: actions/checkout@v4

      - name: Check out immutable host-identify 0.3.5
        uses: actions/checkout@v4
        with:
          repository: zog144/host-identify
          ref: 4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b
          fetch-depth: 0
          path: evidence-checkouts/host-identify
          persist-credentials: false

      - name: Check out exact host-discover dependency PR 2
        uses: actions/checkout@v4
        with:
          repository: zog144/host-discover
          ref: ed63d8df3cb733192c82b60dd95d13389b9922b5
          fetch-depth: 0
          path: evidence-checkouts/host-discover-dependency
          persist-credentials: false

      - name: Check out exact host-discover administrator PR 3
        uses: actions/checkout@v4
        with:
          repository: zog144/host-discover
          ref: 4653cbffcef627dd8945dcb0d14deac5947e97fa
          fetch-depth: 0
          path: evidence-checkouts/host-discover-profile
          persist-credentials: false

      - name: Check out immutable host-install administrator candidate
        uses: actions/checkout@v4
        with:
          repository: zog144/host-install
          ref: 5c03d935be85622789b18559448e1560066d0a37
          fetch-depth: 0
          path: evidence-checkouts/host-install
          persist-credentials: false

      - name: Check out immutable station-access administrator candidate
        uses: actions/checkout@v4
        with:
          repository: zog144/station-access
          ref: a7faf74b23478f473cfb7908306bdc2dd5b3cffc
          fetch-depth: 0
          path: evidence-checkouts/station-access
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run negative evidence inventory regressions
        run: python -m unittest discover -s tests -p test_source_provenance_inventory.py -v

      - name: Verify exact Git ancestry, source license and notice blobs, accepted production pin preservation
        run: python tools/review_admin_credential_provenance.py --checkouts evidence-checkouts

      - name: Download exact station-tested Python wheel inputs
        run: |
          mkdir -p wheelhouse notice-evidence
          python -m pip download --only-binary=:all: --no-deps \
            -r evidence-checkouts/station-access/requirements-security-tested.txt \
            --dest wheelhouse
          python -m pip download --only-binary=:all: --no-deps \
            dbus-next==0.2.3 'dnspython>=2.8,<3' --dest wheelhouse

      - name: Record actual wheel digests, license metadata, full supplied notice text
        run: |
          python tools/inventory_admin_credential_wheel_notices.py \
            --requirements evidence-checkouts/station-access/requirements-security-tested.txt \
            --wheelhouse wheelhouse --output notice-evidence

      - name: Upload review-only distribution notice evidence (never production approval)
        uses: actions/upload-artifact@v4
        with:
          name: admin-credential-python-wheel-notice-evidence
          path: notice-evidence/
          if-no-files-found: error
          retention-days: 14
