name: Administrator credential exact-source provenance ledger
on:
  push:
    branches: [review/admin-credential-provenance-ledger-20261102]
  pull_request:
    branches: [review/admin-password-profile-v1-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    name: Exact immutable candidate source/rights evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-identify
          ref: 4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b
          path: candidate/host-identify
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-discover
          ref: 4653cbffcef627dd8945dcb0d14deac5947e97fa
          path: candidate/host-discover
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-install
          ref: 5c03d935be85622789b18559448e1560066d0a37
          path: candidate/host-install
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/station-access
          ref: a7faf74b23478f473cfb7908306bdc2dd5b3cffc
          path: candidate/station-access
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check exact SHA, accepted pins, ancestry, notices and declared dependencies
        run: python tools/check-admin-credential-source-provenance.py
      - name: Negative rights-promotion / changed notices regressions
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib, tempfile
          path=pathlib.Path('tools/check-admin-credential-source-provenance.py')
          spec=importlib.util.spec_from_file_location("admin_provenance",path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          original=json.loads(pathlib.Path('verification/admin-credential-source-provenance-2026-11-02.json').read_text())
          with tempfile.TemporaryDirectory() as temp:
              for key,value in [
                  ('independent_rightsholder_permission','accepted'),
                  ('distributable_notice_clearance','accepted'),
                  ('native_credential_installation','authorized'),
              ]:
                  modified=dict(original)
                  modified[key]=value
                  candidate=pathlib.Path(temp)/'tampered.json'
                  candidate.write_text(json.dumps(modified))
                  try:
                      module.check(checkout_root=pathlib.Path('candidate'),
                                   ledger_file=candidate)
                  except ValueError:
                      continue
                  raise AssertionError('rights/native acceptance improperly inferred for '+key)
          print('Negative promotion tests PASS')
          PY
      - name: Explicit source-only acceptance boundaries
        if: always()
        run: |
          echo 'First-party license and notice declarations observed, but independent author/rightsholder permission remains unverified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No exact runtime aggregate wheel/JS/dist/rootfs dependency BOM or notices cleared. No production pin or credential installation authorized.' >> "$GITHUB_STEP_SUMMARY"
