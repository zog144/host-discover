name: Administrator credential exact-source provenance ledger
on:
  push:
    branches: [review/admin-credential-provenance-ledger-20261102]
  pull_request:
    branches: [review/admin-password-profile-v1-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    name: Exact immutable candidate source/rights evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-identify
          ref: 4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b
          path: candidate/host-identify
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-discover
          ref: 4653cbffcef627dd8945dcb0d14deac5947e97fa
          path: candidate/host-discover
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-install
          ref: 5c03d935be85622789b18559448e1560066d0a37
          path: candidate/host-install
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/station-access
          ref: 7e8829483c1f2d49b2a4e7f2d97c6c2b9e364a73
          path: candidate/station-access
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check exact SHA, accepted pins, ancestry, notices and declared dependencies
        run: python tools/check-admin-credential-source-provenance.py
      - name: Negative rights-promotion / changed notices regressions
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib, tempfile
          path=pathlib.Path('tools/check-admin-credential-source-provenance.py')
          spec=importlib.util.spec_from_file_location("admin_provenance",path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          original=json.loads(pathlib.Path('verification/admin-credential-source-provenance-2026-11-02.json').read_text())
          with tempfile.TemporaryDirectory() as temp:
              for key,value in [
                  ('independent_rightsholder_permission','accepted'),
                  ('distributable_notice_clearance','accepted'),
                  ('native_credential_installation','authorized'),
              ]:
                  modified=dict(original)
                  modified[key]=value
                  candidate=pathlib.Path(temp)/'tampered.json'
                  candidate.write_text(json.dumps(modified))
                  try:
                      module.check(checkout_root=pathlib.Path('candidate'),
                                   ledger_file=candidate)
                  except ValueError:
                      continue
                  raise AssertionError('rights/native acceptance improperly inferred for '+key)
          print('Negative promotion tests PASS')
          PY
      - name: Per-path independent owner grants are not fixture-accepted
        run: |
          python - <<'PY'
          import importlib.util,json,pathlib,tempfile
          spec=importlib.util.spec_from_file_location(
              'candidate_check','tools/check-admin-credential-source-provenance.py')
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          f=pathlib.Path('verification/admin-credential-changed-path-rights-2026-11-02.json')
          record=json.loads(f.read_text())
          with tempfile.TemporaryDirectory() as d:
              for key,value in [
                  ('rightsholder_authorization','accepted'),
                  ('third_party_or_generated_exception','cleared'),
              ]:
                  tampered=json.loads(f.read_text())
                  tampered['candidates'][0]['files'][0][key]=value
                  source=pathlib.Path(d)/'invent.json'
                  source.write_text(json.dumps(tampered))
                  try:
                      module.check(checkout_root=pathlib.Path('candidate'),
                                   inventory_file=source)
                  except ValueError:
                      continue
                  raise AssertionError('unattributed per-file source permission was accepted')
          assert sum(len(x['files']) for x in record['candidates'])==113
          print('Exact candidate changed-path inventory: 113 observed, zero signed per-file grants')
          PY
      - name: Test acquired-wheel notice inventory and negative substitutions
        run: python -m unittest discover -s tests -p test_source_provenance_inventory.py -v
      - name: Download immutable station-tested Python wheel inputs (review-only)
        run: |
          mkdir -p wheelhouse notice-evidence
          python -m pip download --only-binary=:all: --no-deps \
            -r candidate/station-access/requirements-security-tested.txt --dest wheelhouse
          python -m pip download --only-binary=:all: --no-deps \
            dbus-next==0.2.3 'dnspython>=2.8,<3' --dest wheelhouse
      - name: Record actual wheel digests and complete supplied legal texts
        run: |
          python tools/inventory_admin_credential_wheel_notices.py \
            --requirements candidate/station-access/requirements-security-tested.txt \
            --wheelhouse wheelhouse --output notice-evidence
      - name: Upload review-only Python wheel notices (not release permission)
        uses: actions/upload-artifact@v4
        with:
          name: admin-credential-python-wheel-notice-evidence
          path: notice-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Explicit source-only acceptance boundaries
        if: always()
        run: |
          echo 'First-party license and notice declarations observed, but independent author/rightsholder permission remains unverified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No exact runtime aggregate wheel/JS/dist/rootfs dependency BOM or notices cleared. No production pin or credential installation authorized.' >> "$GITHUB_STEP_SUMMARY"
