name: Exact host-install 0.14 compatibility

on:
  push:
    branches: [main, unstable, review/host-install-0149-compatibility-20261101]
  pull_request:
    branches: [main, unstable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Public companion compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out host-discover
        uses: actions/checkout@v4

      - name: Check out reviewed public host-identify
        uses: actions/checkout@v4
        with:
          repository: zog144/host-identify
          ref: 4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b
          path: companions/host-identify
          persist-credentials: false

      - name: Check out exact host-install 0.14.9 candidate
        uses: actions/checkout@v4
        with:
          repository: zog144/host-install
          ref: c3f12f567d60b0c8bb3da6084acfff82b98dc007
          path: companions/host-install
          persist-credentials: false

      - name: Check out selected public box-control
        uses: actions/checkout@v4
        with:
          repository: zog144/box-control
          ref: 8249715708c6ef8a1fd30a3fb529b4034ffffe25
          path: companions/box-control
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify exact immutable source selections and rights declarations
        run: |
          test "$(git -C companions/host-identify rev-parse HEAD)" = "4a176373ff4cb47a66a8ab1b5fd3d6ff01ff2a3b"
          test "$(git -C companions/host-install rev-parse HEAD)" = "c3f12f567d60b0c8bb3da6084acfff82b98dc007"
          test "$(git -C companions/box-control rev-parse HEAD)" = "8249715708c6ef8a1fd30a3fb529b4034ffffe25"
          python - <<'PY'
          import tomllib
          from pathlib import Path
          install = tomllib.loads(Path("companions/host-install/pyproject.toml").read_text())
          assert install["project"]["version"] == "0.14.9"
          assert install["project"]["license"] == "BSD-3-Clause OR GPL-3.0-only"
          for path in (
              "LICENSE",
              "LICENSES/BSD-3-Clause.txt",
              "LICENSES/GPL-3.0-only.txt",
              "THIRD-PARTY-NOTICES.md",
          ):
              assert (Path("companions/host-install") / path).is_file(), path
          PY

      - name: Install selected public companions and local source
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./companions/host-identify 'pytest>=8,<10'
          python -m pip install --no-deps ./companions/host-install
          python -m pip install --no-deps ./companions/box-control/box-control
          python -m pip install --no-deps .

      - name: Require clean dependency closure
        run: python -m pip check

      - name: Confirm selected component versions
        run: |
          python - <<'PY'
          import importlib.metadata
          import zog.host_discover
          import zog.host_install
          assert zog.host_discover.__version__ == "0.4.14"
          assert zog.host_install.__version__ == "0.14.9"
          assert importlib.metadata.version("host-install") == "0.14.9"
          assert importlib.metadata.version("host-discover") == "0.4.14"
          PY

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run nonprivileged source-level host-discover suite
        run: |
          python -m pytest -q tests             --ignore=tests/test_network_retry.py             --ignore=tests/test_session_recovery.py             --ignore=tests/test_supervised_beacon.py             --ignore=tests/test_host_install_native_compatibility.py

      - name: Run privileged STATE, reporting and recovery fixtures
        run: |
          sudo --preserve-env=PATH "$(command -v python)" -m pytest -q             tests/test_network_retry.py             tests/test_session_recovery.py             tests/test_supervised_beacon.py             tests/test_host_install_native_compatibility.py
