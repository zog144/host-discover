name: Fresh directory STATE legacy bootstrap source
on:
  push:
    branches: [regular/fresh-state-legacy-bootstrap-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-state-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-identify
          ref: 3fd8bd0bf6ae53a2b9f9214b2eac7f2eb2a492f9
          path: dependencies/host-identify
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zog144/host-install
          ref: 5c03d935be85622789b18559448e1560066d0a37
          path: dependencies/host-install
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact compatible candidate set
        run: |
          python -m pip install -e dependencies/host-identify 'pytest>=8,<10'
          python -m pip install --no-deps -e dependencies/host-install
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Source tests with disposable newly prepared /state directory
        run: sudo --preserve-env=PATH "$(command -v python)" -m pytest -q -ra tests/test_fresh_state_bootstrap.py
      - name: Existing non-STATE and retained migration regressions
        run: python -m pytest -q -ra tests/test_daemon.py tests/test_retained_legacy_migration.py tests/test_signed_daemon.py tests/test_destinations.py tests/test_migration_target.py
      - if: always()
        run: echo 'Source CI only. Disposable /state setup; no actual Host, live enrollment, production pins, or native migration changed.' >> "$GITHUB_STEP_SUMMARY"
